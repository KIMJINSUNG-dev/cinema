spring.application.name=backend

# 데이터베이스 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/cinema?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${CINEMA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT 비밀 키 관련 설정
# 액세스 토큰 만료 시간: 30분, 리프레시 토큰 만료 시간: 7일
jwt.secret=${CINEMA_JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# 상영 스케줄 간 여유 시간(분)
cinema.showtime.buffer-minutes=15

# 1회 예약당 허용 최대 좌석 수
cinema.reservation.max-reservation-seat-count=8