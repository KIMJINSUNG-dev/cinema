spring.application.name=backend

# 데이터베이스 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/cinema?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${CINEMA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# JPA 설정-지연 로딩(LAZY) 시 같은 종류의 컬렉션 및 엔티티를 최대 100개까지 IN 쿼리로 묶어서 조회
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# JPA 설정-OSIV는 꺼둠. 영속성 컨텍스트를 서비스 트랜잭션 범위로 한정
spring.jpa.open-in-view=false

# 웹 응답 설정
spring.data.web.pageable.serialization-mode=via-dto

# JWT 비밀 키 관련 설정
# 액세스 토큰 만료 시간: 30분, 리프레시 토큰 만료 시간: 7일
jwt.secret=${CINEMA_JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# 상영 스케줄 간 여유 시간(분)
cinema.showtime.buffer-minutes=15

# 1회 예약당 허용 최대 좌석 수
cinema.reservation.max-reservation-seat-count=8

# 예매 취소 마감: 상영 시작 시각 기준 이 값(분) 이내에는 취소 불가
cinema.reservation.cancel-deadline-minutes=15

# 현장 판매(매표소) 예약의 주인(member)이 되는 시스템 계정 이메일
# 앱 시작 시 WalkInAccountInitializer가 이 이메일로 회원이 없을 때만 생성함
cinema.reservation.walk-in-account-email=walk-in@cinema.local